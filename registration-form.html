<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Registration - UoJ Sports</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .title {
            font-size: 28px;
            font-weight: 900;
            color: #1a1a1a;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .label {
            display: block;
            font-size: 12px;
            font-weight: 900;
            color: #333;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input::placeholder {
            color: #aaa;
        }

        .password-requirements {
            margin-top: 16px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            display: none;
        }

        .password-requirements.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .req-title {
            font-size: 11px;
            font-weight: 900;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            display: block;
        }

        .requirement {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #dc2626;
            margin-bottom: 10px;
            transition: color 0.2s ease;
        }

        .requirement:last-child {
            margin-bottom: 0;
        }

        .requirement.met {
            color: #10b981;
        }

        .requirement-icon {
            font-size: 16px;
            font-weight: 900;
            min-width: 20px;
            text-align: center;
        }

        .requirement-text {
            flex: 1;
        }

        .status-bar {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            transition: all 0.3s ease;
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .status-bar.valid {
            background: #d1fae5;
            color: #10b981;
            border-color: #a7f3d0;
        }

        .form-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-fields.full {
            grid-template-columns: 1fr;
        }

        .error-message {
            display: none;
            color: #dc2626;
            font-size: 13px;
            margin-top: 8px;
            padding: 10px 12px;
            background: #fee2e2;
            border-radius: 8px;
            border-left: 3px solid #dc2626;
        }

        .error-message.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .success-message {
            display: none;
            color: #10b981;
            font-size: 13px;
            margin-top: 8px;
            padding: 10px 12px;
            background: #d1fae5;
            border-radius: 8px;
            border-left: 3px solid #10b981;
        }

        .success-message.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .submit-btn.loading {
            position: relative;
            color: transparent;
        }

        .submit-btn.loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .footer-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }

        .footer-link a:hover {
            color: #764ba2;
        }

        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            background: #dc2626;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .password-strength-bar.medium {
            width: 50%;
            background: #f59e0b;
        }

        .password-strength-bar.strong {
            width: 100%;
            background: #10b981;
        }

        @media (max-width: 600px) {
            .card {
                padding: 30px 20px;
            }

            .title {
                font-size: 24px;
            }

            .form-fields {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo">🏆</div>
                <h1 class="title">Create Account</h1>
                <p class="subtitle">Register your management dashboard</p>
            </div>

            <form id="registrationForm">
                <div class="form-fields full">
                    <div class="form-group">
                        <label class="label" for="fullName">Full Name</label>
                        <input
                            type="text"
                            id="fullName"
                            class="input"
                            placeholder="Enter your full name"
                            required
                        />
                        <div class="error-message" id="nameError"></div>
                    </div>
                </div>

                <div class="form-fields full">
                    <div class="form-group">
                        <label class="label" for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            class="input"
                            placeholder="Enter your email"
                            required
                        />
                        <div class="error-message" id="emailError"></div>
                    </div>
                </div>

                <div class="form-fields full">
                    <div class="form-group">
                        <label class="label" for="username">Username</label>
                        <input
                            type="text"
                            id="username"
                            class="input"
                            placeholder="Choose a username"
                            required
                        />
                        <div class="error-message" id="usernameError"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="label" for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        class="input"
                        placeholder="Create a strong password"
                        required
                    />
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strengthBar"></div>
                    </div>

                    <div class="password-requirements" id="passwordRequirements">
                        <span class="req-title">Password Requirements</span>
                        
                        <div class="requirement" id="req-length">
                            <span class="requirement-icon">✗</span>
                            <span class="requirement-text">At least 8 characters (<span id="charCount">0</span>/8)</span>
                        </div>

                        <div class="requirement" id="req-uppercase">
                            <span class="requirement-icon">✗</span>
                            <span class="requirement-text">One uppercase letter (A-Z)</span>
                        </div>

                        <div class="requirement" id="req-lowercase">
                            <span class="requirement-icon">✗</span>
                            <span class="requirement-text">One lowercase letter (a-z)</span>
                        </div>

                        <div class="requirement" id="req-number">
                            <span class="requirement-icon">✗</span>
                            <span class="requirement-text">One number (0-9)</span>
                        </div>
                        <div class="requirement" id="req-special">
                            <span class="requirement-icon">✗</span>
                            <span class="requirement-text">One special character (!@#$%^&*)</span>
                        </div>

                        <div class="status-bar" id="statusBar">
                            ❌ Password incomplete
                        </div>
                    </div>
                </div>

                <div class="form-fields full">
                    <div class="form-group">
                        <label class="label" for="confirmPassword">Confirm Password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            class="input"
                            placeholder="Confirm your password"
                            required
                        />
                        <div class="error-message" id="confirmError"></div>
                    </div>
                </div>

                <div class="error-message" id="formError"></div>
                <div class="success-message" id="successMessage"></div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Create Account
                </button>
            </form>

            <p class="footer-link">
                Already have an account? <a href="#login">Sign in here</a>
            </p>
        </div>
    </div>

    <script>
        // Form elements
        const form = document.getElementById('registrationForm');
        const passwordInput = document.getElementById('password');
        const passwordRequirements = document.getElementById('passwordRequirements');
        const strengthBar = document.getElementById('strengthBar');
        const statusBar = document.getElementById('statusBar');
        const submitBtn = document.getElementById('submitBtn');

        // Requirements elements
        const requirements = {
            length: {
                element: document.getElementById('req-length'),
                icon: document.querySelector('#req-length .requirement-icon'),
                validate: (pwd) => pwd.length >= 8
            },
            uppercase: {
                element: document.getElementById('req-uppercase'),
                icon: document.querySelector('#req-uppercase .requirement-icon'),
                validate: (pwd) => /[A-Z]/.test(pwd)
            },
            number: {
                element: document.getElementById('req-number'),
                icon: document.querySelector('#req-number .requirement-icon'),
                validate: (pwd) => /[0-9]/.test(pwd)
            },
            special: {
                element: document.getElementById('req-special'),
                icon: document.querySelector('#req-special .requirement-icon'),
                validate: (pwd) => /[!@#$%^&*]/.test(pwd)
            }
        };

        // Validate password
        function validatePassword(password) {
            const checks = {};
            let metCount = 0;

            for (const [key, req] of Object.entries(requirements)) {
                const isMet = req.validate(password);
                checks[key] = isMet;
                if (isMet) metCount++;

                // Update UI
                if (isMet) {
                    req.element.classList.add('met');
                    req.icon.textContent = '✓';
                } else {
                    req.element.classList.remove('met');
                    req.icon.textContent = '✗';
                }
            }

            // Update character count
            document.getElementById('charCount').textContent = password.length;

            // Update password strength bar
            const allMet = metCount === 4;
            if (allMet) {
                strengthBar.className = 'password-strength-bar strong';
                statusBar.textContent = '✅ All requirements met';
                statusBar.classList.add('valid');
            } else if (metCount >= 2) {
                strengthBar.className = 'password-strength-bar medium';
                statusBar.textContent = '⚠ Password incomplete';
                statusBar.classList.remove('valid');
            } else {
                strengthBar.className = 'password-strength-bar';
                statusBar.textContent = '❌ Password incomplete';
                statusBar.classList.remove('valid');
            }

            return allMet;
        }

        // Handle password input
        passwordInput.addEventListener('input', (e) => {
            const password = e.target.value;

            // Show requirements panel
            if (password.length > 0) {
                passwordRequirements.classList.add('active');
            } else {
                passwordRequirements.classList.remove('active');
                strengthBar.className = 'password-strength-bar';
            }

            // Validate and update button state
            validatePassword(password);
            updateSubmitButton();
        });

        // Clear password errors on focus
        passwordInput.addEventListener('focus', () => {
            document.getElementById('formError').classList.remove('show');
        });

        // Validate full form
        function validateForm() {
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            let isValid = true;
            let errorMessage = '';

            // Clear all errors
            document.getElementById('nameError').classList.remove('show');
            document.getElementById('emailError').classList.remove('show');
            document.getElementById('usernameError').classList.remove('show');
            document.getElementById('confirmError').classList.remove('show');

            if (!fullName) {
                document.getElementById('nameError').textContent = 'Full name is required';
                document.getElementById('nameError').classList.add('show');
                isValid = false;
            }

            if (!email) {
                document.getElementById('emailError').textContent = 'Email is required';
                document.getElementById('emailError').classList.add('show');
                isValid = false;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById('emailError').textContent = 'Please enter a valid email';
                document.getElementById('emailError').classList.add('show');
                isValid = false;
            }

            if (!username) {
                document.getElementById('usernameError').textContent = 'Username is required';
                document.getElementById('usernameError').classList.add('show');
                isValid = false;
            } else if (username.length < 3) {
                document.getElementById('usernameError').textContent = 'Username must be at least 3 characters';
                document.getElementById('usernameError').classList.add('show');
                isValid = false;
            }

            if (!validatePassword(password)) {
                errorMessage = 'Password does not meet all requirements';
                isValid = false;
            }

            if (password !== confirmPassword) {
                document.getElementById('confirmError').textContent = 'Passwords do not match';
                document.getElementById('confirmError').classList.add('show');
                isValid = false;
            }

            if (!isValid && errorMessage) {
                document.getElementById('formError').textContent = errorMessage;
                document.getElementById('formError').classList.add('show');
            }

            return isValid;
        }

        // Update submit button state
        function updateSubmitButton() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Get password validation state
            const allRequirementsMet = password.length >= 8 &&
                /[A-Z]/.test(password) &&
                /[0-9]/.test(password) &&
                /[!@#$%^&*]/.test(password);

            const passwordsMatch = password === confirmPassword && password.length > 0;

            // Enable button only if all requirements met and passwords match
            submitBtn.disabled = !(allRequirementsMet && passwordsMatch);
        }

        // Handle confirm password input
        document.getElementById('confirmPassword').addEventListener('input', updateSubmitButton);

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!validateForm()) {
                return;
            }

            // Show loading state
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                // Simulate API call (replace with actual API endpoint)
                await new Promise(resolve => setTimeout(resolve, 1500));

                // Show success message
                document.getElementById('successMessage').textContent = '✅ Account created successfully! Redirecting...';
                document.getElementById('successMessage').classList.add('show');
                document.getElementById('formError').classList.remove('show');

                // Reset form after 2 seconds
                setTimeout(() => {
                    form.reset();
                    passwordRequirements.classList.remove('active');
                    strengthBar.className = 'password-strength-bar';
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                    document.getElementById('successMessage').classList.remove('show');
                }, 2000);
            } catch (error) {
                document.getElementById('formError').textContent = 'An error occurred. Please try again.';
                document.getElementById('formError').classList.add('show');
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });

        // Initialize button state
        updateSubmitButton();
    </script>
</body>
</html>
